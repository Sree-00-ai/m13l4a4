
<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Arguments Object</title>

    <!-- CSS -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e8f4ff;
            text-align: center;
            padding: 30px;
        }

        .container {
            background-color: white;
            max-width: 500px;
            margin: auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 10px gray;
        }

        h1 {
            color: darkblue;
        }

        input {
            padding: 10px;
            width: 80%;
            margin: 10px;
            font-size: 16px;
        }

        button {
            background-color: darkblue;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: royalblue;
        }

        #result {
            background-color: #f0f8ff;
            padding: 15px;
            margin-top: 20px;
            border-radius: 8px;
            line-height: 1.8;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Arguments Object</h1>

        <p>Enter three numbers:</p>

        <input type="number" id="num1" placeholder="First number">
        <input type="number" id="num2" placeholder="Second number">
        <input type="number" id="num3" placeholder="Third number">

        <br><br>

        <button onclick="showArguments()">Show Arguments</button>

        <div id="result">Your result will appear here.</div>
    </div>

    <!-- JavaScript -->
    <script>
        function addNumbers() {
            let sum = 0;

            for (let i = 0; i < arguments.length; i++) {
                sum += arguments[i];
            }

            return sum;
        }

        function showArguments() {
            let a = document.getElementById("num1").value;
            let b = document.getElementById("num2").value;
            let c = document.getElementById("num3").value;

            if (a === "" || b === "" || c === "") {
                document.getElementById("result").textContent =
                    "Please enter all three numbers!";
                return;
            }

            let result = addNumbers(
                Number(a),
                Number(b),
                Number(c)
            );

            document.getElementById("result").innerHTML =
                "First argument: " + Number(a) + "<br>" +
                "Second argument: " + Number(b) + "<br>" +
                "Third argument: " + Number(c) + "<br>" +
                "Number of arguments: 3<br>" +
                "Total sum: " + result;
        }
    </script>

</body>
</html>
